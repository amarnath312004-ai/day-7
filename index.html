<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Mystery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <!-- Background -->
        <div class="stars"></div>

        <!-- Heading -->
        <div class="heading">
            <p>THE FIRST MYSTERY</p>
            <h1>Hit the Heart ❤️</h1>
            <span>Pull the arrow and release it</span>
        </div>


        <!-- REALISTIC HEART -->
        <div class="heart-area" id="heartArea">

            <div class="heart">

                <div class="heart-highlight"></div>

                <div class="heart-text">
                    <span>FOR YOU</span>
                </div>

            </div>

        </div>


        <!-- ARROW TARGET -->
        <div class="target">
            <div class="target-ring"></div>
        </div>


        <!-- BOW -->
        <div class="bow-container" id="bowContainer">

            <div class="bow-wood"></div>

            <div class="bow-string" id="bowString"></div>

            <!-- ARROW -->
            <div
                class="arrow"
                id="arrow"
                aria-label="Drag the arrow backward"
            >

                <div class="arrow-shaft"></div>

                <div class="arrow-head"></div>

                <div class="arrow-feather feather-one"></div>
                <div class="arrow-feather feather-two"></div>

            </div>

        </div>


        <!-- Instruction -->

        <div class="instruction" id="instruction">

            <div class="mouse-icon"></div>

            <p>
                Pull the arrow backward
                <br>
                and release
            </p>

        </div>


        <!-- EXPLOSION -->

        <div class="impact" id="impact">

            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>

        </div>


        <!-- MYSTERY BOXES -->

        <section class="mystery-section" id="mysterySection">

    <h2>Five Mysteries Are Waiting...</h2>

    <div class="boxes">

        <!-- BOX 1 -->
        <div class="box" data-message="Happy Birthday Dr. Nithya Amarnath!">
            <div class="gift">
                <div class="box-body"></div>
                <div class="ribbon"></div>
                <div class="box-lid"></div>
            </div>

            <p>Mystery 1</p>

            <div class="message"></div>
        </div>


        <!-- BOX 2 -->
        <div class="box" data-message="A special surprise is waiting for you.">
            <div class="gift">
                <div class="box-body"></div>
                <div class="ribbon"></div>
                <div class="box-lid"></div>
            </div>

            <p>Mystery 2</p>

            <div class="message"></div>
        </div>


        <!-- BOX 3 -->
        <div class="box" data-message="May every dream you have come true.">
            <div class="gift">
                <div class="box-body"></div>
                <div class="ribbon"></div>
                <div class="box-lid"></div>
            </div>

            <p>Mystery 3</p>

            <div class="message"></div>
        </div>


        <!-- BOX 4 -->
        <div class="box" data-message="Keep smiling and keep achieving your dreams.">
            <div class="gift">
                <div class="box-body"></div>
                <div class="ribbon"></div>
                <div class="box-lid"></div>
            </div>

            <p>Mystery 4</p>

            <div class="message"></div>
        </div>


        <!-- BOX 5 -->
        <div class="box" data-message="Your final surprise is just beginning...">
            <div class="gift">
                <div class="box-body"></div>
                <div class="ribbon"></div>
                <div class="box-lid"></div>
            </div>

            <p>Mystery 5</p>

            <div class="message"></div>
        </div>

    </div>

</section>

    </main>


    
    <script src="./script.js"></script>

</body>
</html>
